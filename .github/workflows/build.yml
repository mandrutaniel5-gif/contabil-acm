# Build ACM Contabil pentru Windows, Android și iOS.
# Rulează doar manual: tab-ul Actions → "Build" → Run workflow, cu platforma dorită.
# Fișierele rezultate apar la finalul rulării, la secțiunea Artifacts.
name: Build

on:
  workflow_dispatch:
    inputs:
      platforme:
        description: 'Ce construiesc: toate, windows, android sau ios'
        default: ios
        required: true

jobs:
  windows:
    if: inputs.platforme == 'toate' || inputs.platforme == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: ACM-Contabil-Windows
          path: dist/*.exe

  android:
    if: inputs.platforme == 'toate' || inputs.platforme == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK (preinstalat pe runner)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "SDK: $ANDROID_HOME, sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - run: npm ci
      - run: npx cap add android
      - run: node scripts/android-camera.cjs
      - run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0e6b6b' --iconBackgroundColorDark '#0e6b6b' --splashBackgroundColor '#f3f5f8' --splashBackgroundColorDark '#0e1115'
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee gradle.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            { grep -E "^e: |error:|ERROR:" gradle.log | head -10; sed -n '/^FAILURE:/,/^\* Try:/p' gradle.log | head -30; } | while IFS= read -r l; do [ -n "$l" ] && echo "::error::$l"; done
            exit $rc
          fi
      - name: Aliniere APK și unealta de semnare (cheia rămâne pe calculatorul tău)
        run: |
          VER=$(node -p "require('./package.json').version")
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "ACM-Contabil-$VER-nesemnat.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "ACM-Contabil-$VER-nesemnat.aab"
          cp "$BT/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v5
        with:
          name: ACM-Contabil-Android
          path: |
            ACM-Contabil-*-nesemnat.apk
            ACM-Contabil-*-nesemnat.aab
            apksigner.jar

  release:
    needs: [windows, android, ios]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { path: out, merge-multiple: true }
      - name: Salvează versiunea ca Release ciornă (privat)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VER=$(node -p "require('./package.json').version")
          ls -la out
          gh release delete "v$VER" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VER" out/* --title "ACM Contabil $VER" --notes "Build automat (ciornă privată). APK-ul și AAB-ul se semnează local, cu cheia de pe calculator." --draft

  ios:
    if: inputs.platforme == 'toate' || inputs.platforme == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Cel mai nou Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Folosesc $X"; sudo xcode-select -s "$X"
      - run: npm ci
      - run: npx cap add ios
      - run: npx --yes @capacitor/assets generate --ios --iconBackgroundColor '#0e6b6b' --splashBackgroundColor '#f3f5f8' --splashBackgroundColorDark '#0e1115'
      - run: npx cap sync ios
      - name: Permisiuni cameră și poze
        run: |
          bash scripts/ios-plist.sh
      - name: Build (nesemnat)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Împachetare .ipa
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "ACM-Contabil-$VER.ipa" Payload
      - uses: actions/upload-artifact@v5
        with:
          name: ACM-Contabil-iOS
          path: ACM-Contabil-*.ipa
